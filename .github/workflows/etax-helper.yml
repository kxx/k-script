name: ETax Helper checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/etax-helper/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/etax-helper.yml']
  pull_request:
    paths: ['packages/etax-helper/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/etax-helper.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm etax-helper:test
      - run: pnpm etax-helper:build
      - name: Verify committed userscript matches sources
        run: git diff --exit-code -- packages/etax-helper/dist/etax-helper.user.js
      - name: Install browser for userscript regression checks
        run: pnpm --filter etax-helper exec playwright install --with-deps chromium
      - name: Test generated userscript in browser
        run: pnpm --filter etax-helper test:browser

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: etax-helper-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish versioned userscript after checks
        uses: actions/github-script@v7
        with:
          script: |
            const {pathToFileURL} = require('node:url');
            const {publishRelease} = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/packages/etax-helper/scripts/publish-release.mjs`).href);
            await publishRelease({github, context, core});
