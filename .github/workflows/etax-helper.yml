name: ETax Helper checks
on:
  push:
    branches: [main]
    paths: ['packages/etax-helper/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/etax-helper.yml']
  pull_request:
    paths: ['packages/etax-helper/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/etax-helper.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm etax-helper:test
      - run: pnpm etax-helper:build
      - name: Verify committed userscript matches sources
        run: git diff --exit-code -- packages/etax-helper/dist/etax-helper.user.js
      - name: Install browser for userscript regression checks
        run: pnpm --filter etax-helper exec playwright install --with-deps chromium
      - name: Test generated userscript in browser
        run: pnpm --filter etax-helper test:browser
  baseline:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Preserve confirmed working 1.2.3 baseline
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/etax-helper-v1.2.3';
            const sha = '1c276fbdc8933085afd99978cf3b8a584929c352';
            try {
              const existing = await github.rest.git.getRef({...context.repo, ref});
              if (existing.data.object.sha !== sha) core.setFailed('Baseline tag points to a different commit; refusing to overwrite it.');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...context.repo, ref: `refs/${ref}`, sha});
            }
